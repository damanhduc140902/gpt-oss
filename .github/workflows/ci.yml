name: CI

# The previous workflow fired only on pushes to a branch called `main`, which
# this repository does not have - the default branch is `one-for-all` - so it
# had never run once. Listing the branches that exist fixes that.
on:
  push:
    branches: [one-for-all, "restructure/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The valuable one: the kernels are a unity build, so a single translation
  # unit has to compile for anything to work at all. Several commits in this
  # repository's history were caught by exactly this check being run by hand.
  compile:
    name: HIP compile (gfx90a)
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-22.04:6.2
    steps:
      - uses: actions/checkout@v4

      # This job is worthless if the device pass silently does not run, and a
      # green tick would then be worse than no CI at all. So prove the toolchain
      # compiles device code before trusting anything it says: feed it a file
      # that is valid on the host and invalid on gfx90a, and require a failure.
      - name: Prove the device pass actually runs
        run: |
          cat > /tmp/devcheck.hip <<'EOF'
          #include <hip/hip_runtime.h>
          __global__ void k(float *o) {
            // __builtin_amdgcn_mfma_f32_16x16x16bf16_1k needs vector operands;
            // passing scalars is a device-side error and nothing else.
            *o = __builtin_amdgcn_mfma_f32_16x16x16bf16_1k(1, 2, 3, 0, 0, 0);
          }
          EOF
          if hipcc --std=c++17 --offload-arch=gfx90a -fsyntax-only \
                   /tmp/devcheck.hip 2>/tmp/devcheck.log; then
            echo "::error::hipcc accepted device-invalid code - the gfx90a pass is NOT running,"
            echo "::error::so every compile step below would pass without checking anything."
            cat /tmp/devcheck.log
            exit 1
          fi
          echo "device pass confirmed: hipcc rejected the bad kernel as expected"

      - name: Compile the unity translation unit
        run: |
          hipcc --std=c++17 -Iinclude -Isrc --offload-arch=gfx90a -O3 \
                -c -o /tmp/run.o src/run.cpp

      - name: Check the object really contains gfx90a device code
        run: |
          # readelf, not llvm-objdump: the ROCm image does not put the LLVM
          # tools on PATH, and a missing tool made this step fail for a reason
          # that had nothing to do with the code.
          if ! readelf -S /tmp/run.o | grep -qi hip_fatbin; then
            echo "::error::the object has no device fatbin - host-only compile"
            readelf -S /tmp/run.o
            exit 1
          fi
          echo "fatbin present"

      - name: Compile with the debug harnesses enabled
        # These are off by default but must keep compiling, or the next person
        # who needs them finds they rotted.
        run: |
          hipcc --std=c++17 -Iinclude -Isrc --offload-arch=gfx90a -O3 \
                -DGETP_DUMP_ATTN=1 -DDEBUG_LDS_POISON \
                -fsyntax-only src/run.cpp

      - name: Compile the CPU-only tools
        run: |
          g++ --std=c++17 -O2 -Iinclude -Isrc -c src/tokenizer.cpp -o /dev/null

  style:
    name: Code style (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pre-commit

      # Only the files this change touches. Running --all-files would demand a
      # whole-tree reformat before anything could go green, which would bury
      # the history in one enormous unrelated diff.
      - name: Run hooks on changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
          else
            pre-commit run --from-ref "HEAD^" --to-ref HEAD
          fi
