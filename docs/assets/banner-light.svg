<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 226" width="1200" height="226" role="img" aria-label="gpt-oss on AMD GPUs - pure C++ and HIP inference">
  <defs>
    <linearGradient id="wmL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14161A"/>
      <stop offset="0.62" stop-color="#D92D3C"/>
      <stop offset="1" stop-color="#F0A31C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="226" fill="#FBFBFC"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#wmL)"/>

  <text x="72" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="66" font-weight="700" fill="url(#wmL)" letter-spacing="-2">gpt-oss</text>

  <text x="72" y="158" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="19" fill="#4A515C">Pure C++ and HIP inference on AMD GPUs. No external libraries.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#646D7B">
    <text x="72" y="196">20b</text>
    <text x="126" y="196" fill="#14161A" font-weight="700">33,979 tok/s</text>
    <text x="300" y="196">120b</text>
    <text x="360" y="196" fill="#14161A" font-weight="700">13,149 tok/s</text>
    <text x="534" y="196">8 x AMD MI250</text>
  </g>

  <line x1="72" y1="214" x2="1128" y2="214" stroke="#E3E5E9" stroke-width="1"/>
</svg>
