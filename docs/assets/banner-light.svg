<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="gpt-oss on AMD GPUs">
  <defs>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ED1C24"/>
      <stop offset="0.55" stop-color="#F26722"/>
      <stop offset="1" stop-color="#FFB400"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="18" fill="#FBFBFC"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="18" fill="none" stroke="#E3E5E9"/>

  <!-- accent rule -->
  <rect x="64" y="66" width="86" height="5" rx="2.5" fill="url(#accentL)"/>

  <text x="64" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="60" font-weight="700" fill="#14161A" letter-spacing="-1.5">gpt-oss</text>
  <text x="318" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="60" font-weight="400" fill="#8A9099" letter-spacing="-1.5">on AMD GPUs</text>

  <text x="64" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" fill="#5A6069">Pure C++ and HIP inference for gpt-oss-20b and gpt-oss-120b. No external libraries.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6B7280">
    <rect x="64" y="192" width="132" height="28" rx="14" fill="#F1F2F4"/>
    <text x="80" y="211">33.9k TPS · 20b</text>
    <rect x="208" y="192" width="132" height="28" rx="14" fill="#F1F2F4"/>
    <text x="224" y="211">13.0k TPS · 120b</text>
    <rect x="352" y="192" width="150" height="28" rx="14" fill="#F1F2F4"/>
    <text x="368" y="211">8 × AMD MI250</text>
  </g>
</svg>
